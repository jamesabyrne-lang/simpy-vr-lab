name: Validate STARS model port
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install "numpy==1.26.4" "simpy==4.1.1" "treat-sim==3.0.0"
      - name: Compile browser model
        run: python -m py_compile stars_model.py
      - name: Compare fixed seeds with upstream treat-sim
        run: python validation/compare_upstream.py
