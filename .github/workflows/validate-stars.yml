name: Validate STARS model bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'treat-sim==3.0.0' 'simpy==4.1.1' pytest selenium
      - name: Run bridge validation
        run: PYTHONPATH=. pytest -q tests/test_bridge.py
      - name: Check browser JavaScript
        run: |
          cat src/app-01.jsfrag src/app-02.jsfrag src/app-03.jsfrag src/app-04.jsfrag src/app-05.jsfrag > /tmp/stars-app.js
          node --check /tmp/stars-app.js
          node --check app.js
      - name: Browser runtime smoke test
        run: python tests/browser_smoke.py
