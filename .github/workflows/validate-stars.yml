name: Validate healthcare SimPy browser prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-healthcare-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'simpy==4.1.1' pytest selenium
      - name: Run model and DOM tests
        run: PYTHONPATH=. pytest -q tests/test_healthcare.py tests/test_dom_contract.py
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Browser runtime smoke test
        run: python tests/browser_smoke.py
